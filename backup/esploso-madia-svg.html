<!--
  BACKUP DELL'ESPLOSO VETTORIALE DELLA MADIA
  ==========================================
  Sostituito l'8 agosto 2026 dal montaggio fotorealistico in 96 fotogrammi
  (img/madia/frame-0001.jpg … frame-0096.jpg, canvas #madia-cv).

  Versione viva fino al commit 158a3c6~1. Per rivederla in azione:
      git show 158a3c6~1:index.html > /tmp/vecchio.html && open /tmp/vecchio.html

  COSA SAPEVA FARE IN PIÙ RISPETTO ALLA VERSIONE ATTUALE
  - 4 finiture cliccabili: cambiavano il fill dei tracciati .esp-fin in tempo reale
  - maniglia gola / pomello: mostrava e nascondeva #man-gola e #man-pomello
  - base metallo / legno: cambiava il fill di .esp-leg-f e .esp-leg-b
  - quote tecniche (#p-quote) che sfumavano durante il montaggio
  Con le foto questi comandi non hanno più nulla da pilotare: per riaverli
  servono immagini dedicate per ogni variante (vedi NOTE-DI-LAVORO.md).

  I 7 componenti erano: p-base, p-sx, p-dx, p-back, p-rip, p-top, p-ante,
  traslati verso la posizione finale con easing cubico legato allo scroll.
-->

.esp-phase { position:relative;min-height:350px;z-index:2; }
.esp-txt { position:absolute;inset:0;opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;pointer-events:none; }
.esp-txt.v { opacity:1;transform:translateY(0);pointer-events:auto; }
.esp-txt h3 { font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;line-height:1.15;margin-bottom:14px;color:var(--text); }
.esp-txt p { font-size:12px;color:var(--muted);line-height:1.9;max-width:300px; }
.esp-stage { position:relative;z-index:1;height:100vh;display:flex;align-items:center;justify-content:center; }
#esploso-svg { width:100%;max-width:660px;height:min(84vh,620px);display:block; }
.esp-hint { position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;transition:opacity .5s; }
#esp-bar { position:absolute;bottom:0;left:0;height:2px;background:var(--gold);width:0%; }
.esp-swatches { display:flex;gap:12px;margin-top:20px; }
.esp-sw { width:28px;height:28px;border-radius:50%;border:1px solid var(--border);cursor:none;transition:transform .25s,border-color .25s,box-shadow .25s; }
.esp-sw:hover { transform:scale(1.15); }
.esp-sw.on { transform:scale(1.15);border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,.25); }
.esp-fin-name { font-size:9px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-top:12px;display:block; }
.esp-optrow { display:flex;align-items:center;gap:8px;margin-top:14px; }
.esp-optrow > span { font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;width:64px; }
.esp-opt { font-family:'Inter',sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);background:transparent;border:.5px solid var(--border);padding:6px 12px;cursor:none;transition:all .25s; }
.esp-opt:hover { border-color:var(--gold); }
.esp-opt.on { color:var(--gold);border-color:var(--gold); }
  .esp-phase { min-height:320px; }
  .esp-txt h3 { font-size:26px; }
  .esp-stage { height:auto;align-self:stretch; }
  #esploso-svg { height:min(44vh,400px); }
</style>

<script>
/* Logica originale (richiede gli elementi #esploso-wrap, #esp-bar, #esp-hint,
   #esp-t1/2/3 e i tracciati SVG qui sopra) */
(function(){
const wrap=document.getElementById('esploso-wrap');
  if(!wrap) return;
  const bar=document.getElementById('esp-bar'), hint=document.getElementById('esp-hint');
  const quote=document.getElementById('p-quote'), label=document.getElementById('p-label');
  const t1=document.getElementById('esp-t1'), t2=document.getElementById('esp-t2'), t3=document.getElementById('esp-t3');
  // [id, offsetX, offsetY, inizio, fine] — ordine di montaggio
  const parts=[
    ['p-base',0,100,.05,.25],
    ['p-sx',-72,0,.14,.34],
    ['p-dx',72,0,.19,.39],
    ['p-back',90,-54,.28,.48],
    ['p-rip',-52,20,.40,.60],
    ['p-top',0,-80,.52,.72],
    ['p-ante',-40,96,.64,.86],
  ].map(p=>({el:document.getElementById(p[0]),ox:p[1],oy:p[2],a:p[3],b:p[4]}));
  const clamp=v=>Math.max(0,Math.min(1,v));
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  let last=-1;
  (function loop(){
    requestAnimationFrame(loop);
    const rect=wrap.getBoundingClientRect();
    const prog=clamp(-rect.top/(wrap.offsetHeight-window.innerHeight));
    if(prog===last) return;
    last=prog;
    parts.forEach(p=>{
      const e=ease(clamp((prog-p.a)/(p.b-p.a)));
      p.el.setAttribute('transform','translate('+(p.ox*(1-e))+' '+(p.oy*(1-e))+')');
    });
    quote.style.opacity=clamp(1-(prog-.45)/.28);
    label.setAttribute('opacity',clamp((prog-.86)/.12));
    bar.style.width=(prog*100)+'%';
    hint.style.opacity=prog<.06?1:0;
    t1.classList.toggle('v',prog<.3);
    t2.classList.toggle('v',prog>=.3&&prog<.72);
    t3.classList.toggle('v',prog>=.72);
  })();
  // finiture: cambia il colore delle ante
  const finName=document.getElementById('esp-fin-name');
  document.querySelectorAll('.esp-sw').forEach(sw=>{
    sw.addEventListener('click',()=>{
      document.querySelectorAll('.esp-sw').forEach(s=>s.classList.remove('on'));
      sw.classList.add('on');
      document.querySelectorAll('.esp-fin').forEach(r=>r.setAttribute('fill',sw.dataset.fin));
      finName.textContent=sw.dataset.name;
    });
  });
  // opzioni: maniglia e base
  const legCol={metallo:{f:'#2A2A2A',b:'#3A3A3C'},legno:{f:'#A9885B',b:'#8F7350'}};
  document.querySelectorAll('.esp-opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.esp-opt[data-opt="'+btn.dataset.opt+'"]').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      if(btn.dataset.opt==='man'){
        document.getElementById('man-gola').setAttribute('opacity',btn.dataset.val==='gola'?1:0);
        document.getElementById('man-pomello').setAttribute('opacity',btn.dataset.val==='pomello'?1:0);
      } else {
        const c=legCol[btn.dataset.val];
        document.querySelectorAll('.esp-leg-f').forEach(r=>r.setAttribute('fill',c.f));
        document.querySelectorAll('.esp-leg-b').forEach(r=>r.setAttribute('fill',c.b));
      }
    });
  });
})();
</script>
